# Include inside the existing HTTPS server block. Build with VITE_BASE_PATH=/qetodo/.
location = /qetodo {
    return 301 /qetodo/;
}

location ^~ /qetodo/api/ {
    client_max_body_size 52m;
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /qetodo/ {
    alias /opt/qetodo/current/apps/web/dist/;
    try_files $uri $uri/ /qetodo/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
